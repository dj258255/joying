openbanking.client-id=${OPENBANKING_CLIENT_ID:YOUR_OPENBANKING_CLIENT_ID}
openbanking.client-secret=${OPENBANKING_CLIENT_SECRET:YOUR_OPENBANKING_CLIENT_SECRET}
openbanking.redirect-uri=${OPENBANKING_REDIRECT_URI:http://localhost:8080/api/v1/accounts/callback}
openbanking.auth-uri=${OPENBANKING_AUTH_URI:https://testapi.openbanking.or.kr/oauth/2.0/authorize}
openbanking.token-uri=${OPENBANKING_TOKEN_URI:https://testapi.openbanking.or.kr/oauth/2.0/token}
openbanking.use-code=${OPENBANKING_USE_CODE:M202400001}


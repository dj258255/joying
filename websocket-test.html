<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<h1>WebSocket 테스트</h1>
<div id="log"></div>
<script>
    // 쿠키에서 값 가져오는 함수
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
    }

    // 쿠키 기반 인증 안내
    // WebSocket은 이제 쿠키에서 자동으로 JWT 토큰을 읽어 인증합니다.
    // 브라우저에서 먼저 로그인하여 쿠키에 access_token이 설정되어 있어야 합니다.

    // 쿠키 확인용 (디버깅)
    const JWT_TOKEN = getCookie('access_token');

    // ⚠️ 필요시 여기만 수정하세요
    const CHAT_ROOM_ID = 1;  // 테스트할 채팅방 ID
    const WS_URL = 'http://localhost:8080/ws/chat';  // WebSocket URL

    let stompClient = null;
    function log(message) {
        const logDiv = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        logDiv.innerHTML += `[${time}] ${message}<br>`;
        console.log(message);
    }

    function connect() {
        // 쿠키 확인 (디버깅용)
        if (!JWT_TOKEN) {
            log('⚠️ 경고: 쿠키에 access_token이 없습니다.');
            log('💡 먼저 브라우저에서 로그인하여 쿠키를 설정하세요.');
        } else {
            log(`🔑 쿠키에서 토큰 발견: ${JWT_TOKEN.substring(0, 20)}...`);
        }

        const socket = new SockJS(WS_URL);
        stompClient = Stomp.over(socket);

        // 쿠키 기반 인증: 빈 헤더로 연결 (쿠키가 자동으로 전송됨)
        stompClient.connect(
            {},  // 빈 헤더 - 서버가 쿠키에서 자동으로 JWT를 추출
            (frame) => {
                log('✅ WebSocket 연결 성공! (쿠키 기반 인증)');

                // 메시지 수신 구독
                stompClient.subscribe(`/topic/chat/${CHAT_ROOM_ID}`, (message) => {
                    const data = JSON.parse(message.body);
                    log(`📩 메시지 수신: ${JSON.stringify(data, null, 2)}`);
                });

                // 읽음 상태 구독
                stompClient.subscribe(`/topic/chat/${CHAT_ROOM_ID}/read`, (message) => {
                    const data = JSON.parse(message.body);
                    log(`✅ 읽음 처리: ${JSON.stringify(data, null, 2)}`);
                });

                // 타이핑 상태 구독
                stompClient.subscribe(`/topic/chat/${CHAT_ROOM_ID}/typing`, (message) => {
                    const data = JSON.parse(message.body);
                    log(`⌨️ 타이핑 중: ${JSON.stringify(data, null, 2)}`);
                });

                log('🎧 모든 토픽 구독 완료');

                // Heartbeat 시작 (30초마다)
                setInterval(() => {
                    if (stompClient && stompClient.connected) {
                        stompClient.send('/app/chat/heartbeat', {}, '{}');
                        log('💓 Heartbeat 전송');
                    }
                }, 30000);
            },
            (error) => {
                log(`❌ 연결 실패: ${error}`);
            }
        );
    }

    // 테스트용 함수들 (콘솔에서 호출 가능)
    window.sendMessage = function(content) {
        if (!stompClient || !stompClient.connected) {
            log('❌ WebSocket이 연결되지 않았습니다');
            return;
        }
        stompClient.send(`/app/chat/${CHAT_ROOM_ID}/send`, {}, JSON.stringify({
            type: 'TEXT',
            content: content
        }));
        log(`📤 메시지 전송: ${content}`);
    };

    window.sendTyping = function() {
        if (!stompClient || !stompClient.connected) {
            log('❌ WebSocket이 연결되지 않았습니다');
            return;
        }
        stompClient.send(`/app/chat/${CHAT_ROOM_ID}/typing`, {}, '{}');
        log('⌨️ 타이핑 알림 전송');
    };

    window.sendRead = function() {
        if (!stompClient || !stompClient.connected) {
            log('❌ WebSocket이 연결되지 않았습니다');
            return;
        }
        stompClient.send(`/app/chat/${CHAT_ROOM_ID}/read`, {}, '{}');
        log('✅ 읽음 처리 전송');
    };

    window.sendImage = function(imageUrl, fileName, fileSize) {
        if (!stompClient || !stompClient.connected) {
            log('❌ WebSocket이 연결되지 않았습니다');
            return;
        }
        stompClient.send(`/app/chat/${CHAT_ROOM_ID}/send`, {}, JSON.stringify({
            type: 'IMAGE',
            content: '이미지 전송',
            imageUrl: imageUrl,
            fileName: fileName,
            fileSize: fileSize
        }));
        log(`📤 이미지 메시지 전송: ${fileName}`);
    };

    window.disconnect = function() {
        if (stompClient) {
            stompClient.disconnect(() => {
                log('🔌 WebSocket 연결 종료');
            });
        }
    };

    // 초기화
    log('🚀 WebSocket 테스트 시작');
    log(`📍 서버 URL: ${WS_URL}`);
    log(`💬 채팅방 ID: ${CHAT_ROOM_ID}`);
    log('📌 사용 가능한 콘솔 명령어:');
    log('  - sendMessage("메시지 내용")');
    log('  - sendTyping()');
    log('  - sendRead()');
    log('  - sendImage("url", "파일명", 크기)');
    log('  - disconnect()');
    log('━━━━━━━━━━━━━━━━━━━━━━━━━━');

    // 페이지 로드 시 자동 연결
    connect();
</script>
</body>
</html>

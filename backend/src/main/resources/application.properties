# -------------------------------------
# ê¸°ë³¸ ì íë¦¬ì¼ì´ì ì ë³´
# -------------------------------------
spring.application.name=Joying
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# -------------------------------------
# MySQL ë°ì´í°ë² ì´ì¤ ì¤ì 
# -------------------------------------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:project_db}
spring.datasource.username=${POSTGRES_USERNAME:joying}
spring.datasource.password=${POSTGRES_PASSWORD:joying}

# -------------------------------------
# JPA ì¤ì 
# -------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 비관적 락 타임아웃 설정 (10초)
spring.jpa.properties.jakarta.persistence.lock.timeout=10000
spring.jpa.properties.hibernate.query.timeout=10

# -------------------------------------
# Flyway 설정
# -------------------------------------
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=V
spring.flyway.sql-migration-separator=__
spring.flyway.sql-migration-suffixes=.sql
spring.flyway.baseline-version=0

spring.flyway.validate-on-migrate=false
# JPA가 먼저 실행되도록 설정
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.defer-datasource-initialization=false

# -------------------------------------
# 파일 업로드 설정
# -------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# -------------------------------------
# ê¸°ë³¸ íë¡í ì´ë¯¸ì§ ì¤ì 
# -------------------------------------
app.default-profile-image=/images/default_profile_image.png

# -------------------------------------
# Redis ì¤ì 
# -------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# -------------------------------------
# -------------------------------------
# Profile별로 설정됨 (application-local.properties, application-prod.properties)

# -------------------------------------
# ë¡ê¹ ì¤ì 
# -------------------------------------
logging.level.org.hibernate.SQL=${LOGGING_LEVEL:info}
spring.jpa.show-sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -------------------------------------
# Swagger/OpenAPI ì¤ì 
# -------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.doc-expansion=none
springdoc.default-consumes-media-type=application/json

# -------------------------------------
# JWT ì¤ì 
# -------------------------------------
jwt.secret=${JWT_SECRET:joying-local-secret-key-for-development-only}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
jwt.access-token-cookie-name=${JWT_ACCESS_TOKEN_COOKIE_NAME:access_token}
jwt.refresh-token-cookie-name=${JWT_REFRESH_TOKEN_COOKIE_NAME:refresh_token}

# -------------------------------------
# OAuth2 ì¤ì 
# -------------------------------------
oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/auth/callback}

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:YOUR_KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:YOUR_KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email,profile_image
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

# Kakao Provider
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# -------------------------------------
# CORS ì¤ì 
# -------------------------------------
# 허용할 Origin (쉼표로 구분, 프론트엔드 + 백엔드 Swagger)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000},http://localhost:8080

# -------------------------------------
# cloudflare r2
# -------------------------------------
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT}
cloudflare.r2.bucket=${CLOUDFLARE_R2_BUCKET}
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}
app.file.public-base-url=${CLOUDFLARE_R2_PUBLIC_BASE_URL}

# -------------------------------------
# Cookie 보안 설정
# -------------------------------------
# 쿠키 Secure 플래그 (환경변수 기반)
# - 로컬/개발: false (HTTP 허용)
# - 프로덕션: true (HTTPS 필수)
cookie.secure=${COOKIE_SECURE:false}

# -------------------------------------
# Toss Payments API
# -------------------------------------
toss.secret-key=${TOSS_SECRET_KEY}

# -------------------------------------
# 개발 모드 설정
# -------------------------------------
# 본인 상품 대여 허용 (테스트 편의성)
# - true: 본인 상품도 대여 가능 (개발/테스트)
# - false: 본인 상품 대여 불가 (프로덕션)
app.dev-mode.allow-self-rental=${ALLOW_SELF_RENTAL:false}

# -------------------------------------
# Resilience4j Circuit Breaker
# -------------------------------------
resilience4j.circuitbreaker.instances.tossPayments.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.tossPayments.slidingWindowSize=10
resilience4j.circuitbreaker.instances.tossPayments.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.tossPayments.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.tossPayments.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.tossPayments.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.tossPayments.failureRateThreshold=50
resilience4j.circuitbreaker.instances.tossPayments.eventConsumerBufferSize=10

spring.elasticsearch.uris=http://${ELASTIC_HOST:localhost}:9200
spring.elasticsearch.username=elastic
spring.elasticsearch.password=${ELASTIC_PASSWORD}

# -------------------------------------
# Web Push (브라우저 푸시 알림)
# -------------------------------------
# 푸시 알림 활성화 여부 (true로 설정 시 VAPID 키 필요)
web-push.enabled=${WEB_PUSH_ENABLED:false}

# VAPID 키 (Web Push 인증용 공개/비공개 키)
# 생성 방법: npx web-push generate-vapid-keys
web-push.public-key=${WEB_PUSH_PUBLIC_KEY:}
web-push.private-key=${WEB_PUSH_PRIVATE_KEY:}

# -------------------------------------
# 돈을 무엇으로 옮기는가
# -------------------------------------
# wallet : 내부 원장. 기본값이고 지금 켤 수 있는 유일한 값이다
# ssafy  : 외부 금융망. 붙을 API 키가 없어 켜도 동작하지 않는다.
#          코드를 남겨 둔 것은 밖으로 나가는 호출일 때만 생기는 문제들
#          (타임아웃, 미확정, 재조회로 확정하기)이 거기에 담겨 있기 때문이다.
#          다른 결제망을 붙일 때 그 모양을 그대로 쓴다
joying.money.transfer=${JOYING_MONEY_TRANSFER:wallet}

# 대여 기간 상한. 보증금을 붙잡아 둘 수 있는 기간 안에서만 받는다
joying.rental.max-period-days=${RENTAL_MAX_PERIOD_DAYS:21}

# 보증금 반환을 요청한 뒤 카드사에 반영됐는지 다시 확인하는 주기
joying.escrow.release-confirmation.interval-ms=${ESCROW_RELEASE_CONFIRMATION_INTERVAL_MS:300000}

# 매일 장부를 검산하는 시각
joying.escrow.reconciliation.cron=${ESCROW_RECONCILIATION_CRON:0 10 4 * * *}

# 오래 안 쓴 채팅방을 닫는 시각
joying.chat.auto-close.cron=${CHAT_AUTO_CLOSE_CRON:0 30 4 * * *}

# 미확정 적립을 다시 물어 확정하는 주기 (외부 금융망 구현일 때만 돈다)
joying.escrow.deposit-recovery.interval-ms=${ESCROW_DEPOSIT_RECOVERY_INTERVAL_MS:60000}

# 아래 금융망 설정은 joying.money.transfer=ssafy 일 때만 쓰인다
ssafy.finance.base-url=${SSAFY_FINANCE_BASE_URL:https://finopenapi.ssafy.io}
ssafy.finance.api-key=${SSAFY_FINANCE_API_KEY:}
ssafy.finance.connect-timeout=${SSAFY_FINANCE_CONNECT_TIMEOUT:2s}
ssafy.finance.read-timeout=${SSAFY_FINANCE_READ_TIMEOUT:5s}
ssafy.finance.escrow.account-no=${SSAFY_ESCROW_ACCOUNT_NO:0015555555555555}
ssafy.finance.escrow.user-key=${SSAFY_ESCROW_USER_KEY:}

# 관측
#
# 필요한 것만 연다. 기본으로 열리는 것 중에는 설정값과 빈 목록처럼 밖에 보여 줄 이유가
# 없는 것이 섞여 있다.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized

# 지표에 이 앱의 이름을 붙인다. 여러 대를 띄웠을 때 어느 것인지 구분해야 한다
management.metrics.tags.application=joying-backend

# 백분위를 서버에서 계산하지 않고 히스토그램으로 내보낸다. 여러 대를 합쳐서 볼 때
# 서버마다 따로 낸 백분위는 더할 수 없다
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.chat.message.delivery=true
management.metrics.distribution.percentiles-histogram.chat.message.queue.wait=true

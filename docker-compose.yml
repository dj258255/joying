services:
  postgres:
    image: postgres:16-alpine
    container_name: joying-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - joying-network
    restart: unless-stopped

  redis:
    image: redis:7.2.11-alpine
    container_name: joying-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    env_file:
      - .env
    # 안쪽은 늘 6379 다. REDIS_PORT 는 앱이 붙는 포트라 그것으로 공개 포트를 정하면
    # 둘이 함께 움직인다. 실제로 공개 포트만 옮기려다 앱이 안쪽 Redis 를 6380 으로
    # 찾아 기동에 실패했다.
    #
    # 루프백에만 연다. 저장소는 같은 네트워크 안에서만 쓰인다
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - joying-network
    restart: unless-stopped


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: joying-backend
    env_file:
      - .env
    # 루프백에만 연다.
    #
    # 배포 마지막에 8080 으로 건강을 확인하는데 이 서비스는 어디에도 포트를 열지
    # 않고 있었다. 확인이 늘 실패하는 상태였다. 밖으로 열면 앞단의 요청 제한을
    # 지나지 않고 바로 닿으므로, 같은 기계에서만 닿게 한다
    # 이 기계의 8080 이 이미 쓰이고 있으면 BACKEND_PORT 로 옮긴다.
    # 안쪽은 그대로 8080 이므로 앞단은 손댈 것이 없다
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_ELASTICSEARCH_URIS: http://joying-elasticsearch:9200
      SPRING_ELASTICSEARCH_USERNAME: elastic
      SPRING_ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}
    depends_on:
      # 저장소가 준비된 뒤에 뜬다. postgres 는 건강 검사가 있으니 그것을 기다린다
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G
        reservations:
          cpus: '1.0'
          memory: 4G
    networks:
      - joying-network
    restart: unless-stopped

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: joying-ai
    env_file:
      - ai/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - joying-network
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/Dockerfile.nginx
    container_name: joying-nginx
    depends_on:
      - backend
      - ai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - joying-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: joying-certbot
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    entrypoint: sh
    command:
      - -c
      - |
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h
        done
    networks:
      - joying-network
    restart: unless-stopped


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.5
    container_name: joying-elasticsearch
    env_file:
      - .env
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - network.host=0.0.0.0
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    # 루프백에만 연다. 이 컨테이너는 xpack.security.enabled=false 로 뜨므로,
    # 밖으로 열면 암호 없이 색인을 읽고 쓸 수 있다
    ports:
      - "127.0.0.1:${ELASTIC_HOST_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-plugins:/usr/share/elasticsearch/plugins
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - joying-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200 >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 12
    command:
      - /bin/bash
      - -c
      - |
        if [ ! -d "/usr/share/elasticsearch/plugins/analysis-nori" ]; then
          echo "📦 Installing analysis-nori plugin..."
          elasticsearch-plugin install --batch analysis-nori
        fi
        echo "✅ Starting Elasticsearch..."
        /usr/local/bin/docker-entrypoint.sh elasticsearch

networks:
  joying-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  es-data:
  es-plugins:
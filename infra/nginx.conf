user  nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
  resolver 127.0.0.11 ipv6=off;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  # ==========================================
  # Rate Limiting 설정 (DDoS 및 과도한 요청 방지)
  # ==========================================

  # 1. API 요청 제한 (IP 기반)
  # - 1초당 최대 20개 요청 (burst 40개)
  # - 초과 시 503 Service Temporarily Unavailable 응답
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  # 2. AI 요청 제한 (이미지 처리 - 부하가 큼)
  # - 1초당 최대 2개 요청 (burst 5개)
  # - 이미지 처리는 리소스를 많이 사용하므로 엄격하게 제한
  limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=2r/s;

  # 3. WebSocket 연결 제한 (채팅)
  # - 1초당 최대 10개 연결 (burst 20개)
  limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;

  # 4. 동시 연결 수 제한 (IP당)
  # - 동시 최대 50개 연결 (일반 사용자는 5~10개)
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # 5. 로그인/OAuth 요청 제한 (무차별 대입 공격 방지)
  # - 1분당 최대 10개 요청
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  # Rate Limit 초과 시 로그 레벨 (warn으로 설정)
  limit_req_log_level warn;
  limit_conn_log_level warn;

  # Rate Limit 초과 시 응답 코드 (기본 503)
  limit_req_status 429;  # 429 Too Many Requests
  limit_conn_status 429;

    # ==========================================
    # 채팅 웹소켓을 방 단위로 같은 노드에 붙인다
    # ==========================================
    #
    # 같은 방의 두 사람이 다른 노드에 붙으면 두 노드가 각자 Redis 에 발행한다. 번호는
    # 증가 연산 하나가 정하므로 유일하지만, 1번이 41번을 발행하는 것과 2번이 42번을
    # 발행하는 것 사이에는 아무 순서가 없다. 받는 쪽에 번호가 뒤섞여 닿는다.
    #
    # 재 보니 400건 중 42~54회였다. 같은 노드에 붙이면 0이다.
    # (docs/performance/one-to-one-two-node.md)
    #
    # 이 서비스는 1:1 이라 한 방에 두 명뿐이다. 방으로 묶어도 한 노드에 쏠리지 않는다.
    #
    # 열쇠를 세 군데서 찾는다. 아래 순서대로 본다.
    #
    # 쿠키는 브라우저에 하나뿐이라 탭을 둘 열어 서로 다른 방을 보면 나중 탭이 앞선
    # 방의 열쇠로 간다. 노드 3개에서 69.1% 가 엉뚱한 노드로 갔다.
    # (docs/performance/room-sticky-routing.md)
    #
    # 경로는 요청마다 다르다. SockJS 가 기본 주소 뒤에 /{서버}/{세션}/websocket 을
    # 덧붙이므로 방 번호는 앞쪽에 그대로 남는다.
    map $uri $room_from_path {
        default "";
        "~^/ws/chat/(?<rid>[0-9]+)(/|$)" $rid;
    }

    # 옛 화면은 아직 쿠키로 알린다. 배포 중에 둘이 섞인다
    map $room_from_path $room_from_path_or_cookie {
        ""      $cookie_chat_room;
        default $room_from_path;
    }

    # 원시 웹소켓으로 붙는 쪽(부하 실험)은 쿼리스트링을 쓴다
    map $room_from_path_or_cookie $chat_room_key {
        ""      $arg_roomId;
        default $room_from_path_or_cookie;
    }

    # consistent 를 쓰는 이유는 노드가 늘거나 줄 때다. 단순 해시는 노드 수가 바뀌면
    # 거의 모든 방이 다른 노드로 옮겨 간다. 붙어 있던 연결이 한꺼번에 끊긴다.
    upstream chat_backend {
        hash $chat_room_key consistent;
        server joying-backend:8080;
        # 노드를 늘릴 때 여기에 더한다
        # server joying-backend-2:8080;
    }

    # ==========================================
       # Upstream payment 서버 설정 추가_소연
    # ==========================================
   upstream payment_backend {
     server 172.31.42.18:8080;

   }
  server {
    listen 80;
    server_name k13c202.p.ssafy.io;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name k13c202.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/k13c202.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k13c202.p.ssafy.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 전체 서버에 동시 연결 수 제한 적용
    limit_conn conn_limit 50;

    client_max_body_size 50m;

    # AI 서버 (FastAPI) - 이미지 기반 게시글 자동 생성
    set $ai_upstream http://joying-ai:8000;
    location ^~ /ai/ {
      # AI Rate Limiting 적용 (초당 2개, burst 5개)
      # nodelay: burst 요청도 즉시 처리 (대기 없음)
      limit_req zone=ai_limit burst=5 nodelay;

      # OPTIONS 메서드 처리 (CORS preflight) - 맨 위에 배치
      if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "https://k13c202.p.ssafy.io" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
      }

      # /ai/ 제거하고 나머지 경로를 그대로 전달
      rewrite ^/ai/(.*) /$1 break;
      proxy_pass         $ai_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-Host $host;
      proxy_redirect     off;

      # CORS 헤더 추가 (모든 응답에 항상 추가)
      add_header Access-Control-Allow-Origin "https://k13c202.p.ssafy.io" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

      # 타임아웃 설정 (AI 응답 대기 시간 - 최대 60초)
      proxy_connect_timeout 60s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    set $backend_upstream http://joying-backend:8080;

    # OAuth/Login Rate Limiting (무차별 대입 공격 방지)
    location ~ ^/(oauth2|login)/ {
      # 1분당 최대 10개 요청
      limit_req zone=auth_limit burst=5 nodelay;

      proxy_pass         $backend_upstream;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-Host $host;
      proxy_redirect     off;
    }

    # API Rate Limiting (일반 API 요청)
    location ~ ^/(api|v3|swagger|actuator)/ {
      # 초당 최대 20개 요청 (burst 40개)
      limit_req zone=api_limit burst=40 nodelay;

      proxy_pass         $backend_upstream;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-Host $host;
      proxy_redirect     off;
    }

    # WebSocket Rate Limiting (채팅)
    location ^~ /ws/ {
        # 초당 최대 10개 연결 (burst 20개)
        limit_req zone=ws_limit burst=20 nodelay;

        # 방 단위로 같은 노드에 붙인다. 변수가 아니라 upstream 이름을 직접 쓰는 이유는,
        # 변수로 쓰면 nginx 가 upstream 이 아니라 주소로 읽어 해시가 걸리지 않기 때문이다
        proxy_pass         http://chat_backend;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # X-Forwarded-Port 제거: HTTPS 기본 포트(443)는 URL에 포함하지 않음

        proxy_set_header   Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;
    }

    location / {
      root   /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
  }
}

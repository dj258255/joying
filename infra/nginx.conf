user  nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
  resolver 127.0.0.11 ipv6=off;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

    # ==========================================
       # Upstream payment 서버 설정 추가_소연
    # ==========================================
   upstream payment_backend {
     server 172.31.42.18:8080;

   }
  server {
    listen 80;
    server_name k13c202.p.ssafy.io;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name k13c202.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/k13c202.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k13c202.p.ssafy.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;


    client_max_body_size 50m;


    location = /jenkins { return 301 /jenkins/; }

    set $jenkins_upstream http://joying-jenkins:8080;
        location ^~ /jenkins/ {
          proxy_pass         $jenkins_upstream;
          proxy_http_version 1.1;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
          proxy_set_header   X-Forwarded-Port 443;
          proxy_set_header   X-Forwarded-Prefix /jenkins;
          proxy_set_header   Upgrade $http_upgrade;
          proxy_set_header   Connection "upgrade";
          proxy_read_timeout 3600;
        }

    set $backend_upstream http://joying-backend:8080;
    location ~ ^/(api|oauth2|login|v3|swagger|actuator)/ {
      proxy_pass         $backend_upstream;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-Host $host;
      proxy_set_header   X-Forwarded-Port $server_port;
      proxy_redirect     off;
    }

    location ^~ /ws/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port $server_port;

        proxy_set_header   Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;
    }

    location / {
      root   /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
  }
}

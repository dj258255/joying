
# -------------------------------------
# Production
# -------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

logging.level.root=INFO
logging.level.com.joying=INFO
logging.level.org.hibernate.SQL=INFO

# -------------------------------------
# MongoDB
# -------------------------------------
# 프로덕션 환경 - 인증 사용 (Docker Compose .env.prod 기반)
spring.data.mongodb.uri=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DATABASE}?authSource=admin&minPoolSize=10&maxPoolSize=50&maxIdleTimeMS=60000&waitQueueTimeoutMS=5000&connectTimeoutMS=10000&serverSelectionTimeoutMS=5000

# -------------------------------------
# Swagger
# -------------------------------------
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# -------------------------------------
# Server
# -------------------------------------
server.forward-headers-strategy=framework
server.tomcat.use-relative-redirects=true
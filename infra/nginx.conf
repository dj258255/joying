user  nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
  resolver 127.0.0.11 ipv6=off;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

    # ==========================================
       # Upstream payment 서버 설정 추가_소연
    # ==========================================
   upstream payment_backend {
     server 172.31.42.18:8080;

   }
  server {
    listen 80;
    server_name k13c202.p.ssafy.io;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name k13c202.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/k13c202.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k13c202.p.ssafy.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;


    client_max_body_size 50m;


    location = /jenkins { return 301 /jenkins/; }

    set $jenkins_upstream http://joying-jenkins:8080;
        location ^~ /jenkins/ {
          proxy_pass         $jenkins_upstream;
          proxy_http_version 1.1;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
          proxy_set_header   X-Forwarded-Port 443;
          proxy_set_header   X-Forwarded-Prefix /jenkins;
          proxy_set_header   Upgrade $http_upgrade;
          proxy_set_header   Connection "upgrade";
          proxy_read_timeout 3600;
        }

    # AI 서버 (FastAPI) - 이미지 기반 게시글 자동 생성
    set $ai_upstream http://joying-ai:8000;
    location ^~ /ai/ {
      # OPTIONS 메서드 처리 (CORS preflight) - 맨 위에 배치
      if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "https://k13c202.p.ssafy.io" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
      }

      # /ai/ 제거하고 나머지 경로를 그대로 전달
      rewrite ^/ai/(.*) /$1 break;
      proxy_pass         $ai_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-Host $host;
      proxy_redirect     off;

      # CORS 헤더 추가 (모든 응답에 항상 추가)
      add_header Access-Control-Allow-Origin "https://k13c202.p.ssafy.io" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

      # 타임아웃 설정 (AI 응답 대기 시간 - 최대 60초)
      proxy_connect_timeout 60s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    set $backend_upstream http://joying-backend:8080;
    location ~ ^/(api|oauth2|login|v3|swagger|actuator)/ {
      proxy_pass         $backend_upstream;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   X-Forwarded-Host $host;
      # X-Forwarded-Port 제거: HTTPS 기본 포트(443)는 URL에 포함하지 않음
      proxy_redirect     off;
    }

    location ^~ /ws/ {
        proxy_pass         $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # X-Forwarded-Port 제거: HTTPS 기본 포트(443)는 URL에 포함하지 않음

        proxy_set_header   Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;
    }

    location / {
      root   /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
  }
}

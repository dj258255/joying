version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: joying-mysql
    env_file:
      - .env.prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - joying-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: joying-redis
    env_file:
      - .env.prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - joying-network
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: joying-mongodb
    env_file:
      - .env.prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
      TZ: Asia/Seoul
    ports:
      - "${MONGODB_PORT}:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - joying-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: joying-backend
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - mysql
      - redis
      - mongodb
    networks:
      - joying-network
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/Dockerfile.nginx
    container_name: joying-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - joying-network
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts
    container_name: joying-jenkins
    user: root
    ports:
      - "8081:8080"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - joying-network
    restart: unless-stopped

networks:
  joying-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  mongodb-data:
  mongodb-config:
  jenkins-data:
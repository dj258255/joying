# -------------------------------------
# Test Environment
# -------------------------------------

# -------------------------------------
# H2 In-Memory Database
# -------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# -------------------------------------
# H2 Console (for debugging)
# -------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------
# JPA
# -------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# -------------------------------------
# SQL Initialization
# -------------------------------------
spring.sql.init.mode=never

# -------------------------------------
# Redis (for testing)
# -------------------------------------
# Use embedded Redis or mock if needed
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# -------------------------------------
# MongoDB (for testing)
# -------------------------------------
# Use embedded MongoDB or mock if needed
spring.data.mongodb.uri=mongodb://localhost:27017/test_db

# -------------------------------------
# JWT (for testing)
# -------------------------------------
jwt.secret=test-secret-key-for-testing-only-minimum-256-bits-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000
jwt.access-token-cookie-name=access_token
jwt.refresh-token-cookie-name=refresh_token

# -------------------------------------
# OAuth2 (for testing)
# -------------------------------------
oauth2.redirect-uri=http://localhost:3000/auth/callback

# Kakao OAuth2 (test dummy values)
spring.security.oauth2.client.registration.kakao.client-id=test-kakao-client-id
spring.security.oauth2.client.registration.kakao.client-secret=test-kakao-client-secret
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email,profile_image
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

# Kakao Provider
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# -------------------------------------
# CORS
# -------------------------------------
cors.allowed-origins=http://localhost:3000,http://localhost:8080

# -------------------------------------
# Cloudflare R2 (test dummy values)
# -------------------------------------
# 테스트 환경에서는 실제 S3 연결이 필요 없으므로 더미 값 사용
cloudflare.r2.endpoint=https://test-endpoint.r2.cloudflarestorage.com
cloudflare.r2.bucket=test-bucket
cloudflare.r2.access-key=test-access-key
cloudflare.r2.secret-key=test-secret-key
app.file.public-base-url=https://test-public-url.r2.dev

# -------------------------------------
# SSAFY 금융망 API (test dummy values)
# -------------------------------------
ssafy.finance.base-url=https://finopenapi.ssafy.io
ssafy.finance.api-key=test-ssafy-api-key

# -------------------------------------
# Logging (test environment)
# -------------------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
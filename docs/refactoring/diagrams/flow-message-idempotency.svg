<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <marker id="ir" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F04452"/>
    </marker>
    <marker id="ib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3182F6"/>
    </marker>
  </defs>
  <rect width="1400" height="640" fill="#000000"/>
  <text x="56" y="72" font-size="46" font-weight="800" fill="#FFFFFF">멱등 판정을 조회로 하면 둘 다 없다고 읽는다</text>
  <text x="56" y="106" font-size="28.7" fill="#8B95A1">같은 전송 식별자로 16건을 동시에 저장하고 남은 문서를 셌다 (실 MongoDB 7.0)</text>

  <rect x="56" y="150" width="630" height="300" rx="18" fill="#15181E" stroke="#2A2F38"/>
  <text x="84" y="190" font-size="28.7" font-weight="700" fill="#F04452">개선 전: 애플리케이션이 조회로 판정</text>
  <g text-anchor="middle">
    <rect x="84" y="212" width="230" height="70" rx="14" fill="#F2F4F6"/>
    <text x="199" y="240" font-size="23.32" font-weight="700" fill="#191F28">요청 1: 있나?</text>
    <text x="199" y="266" font-size="22.43" fill="#4E5968">없음</text>
    <rect x="84" y="300" width="230" height="70" rx="14" fill="#F2F4F6"/>
    <text x="199" y="328" font-size="23.32" font-weight="700" fill="#191F28">요청 2: 있나?</text>
    <text x="199" y="354" font-size="22.43" fill="#4E5968">없음</text>
    <rect x="380" y="236" width="276" height="110" rx="14" fill="#2A1418" stroke="#F04452"/>
    <text x="518" y="278" font-size="23.32" font-weight="700" fill="#F04452">둘 다 저장</text>
    <text x="518" y="312" font-size="22.43" fill="#8B95A1">읽는 사이에 아무도 없다</text>
    <text x="371" y="414" font-size="33" font-weight="800" fill="#F04452">16건 동시 → 16건 남음</text>
  </g>
  <line x1="314" y1="250" x2="374" y2="276" stroke="#F04452" stroke-width="2" marker-end="url(#ir)"/>
  <line x1="314" y1="334" x2="374" y2="308" stroke="#F04452" stroke-width="2" marker-end="url(#ir)"/>

  <rect x="714" y="150" width="630" height="300" rx="18" fill="#15181E" stroke="#2A2F38"/>
  <text x="742" y="190" font-size="28.7" font-weight="700" fill="#3182F6">개선 후: 저장소 유니크 제약이 판정</text>
  <g text-anchor="middle">
    <rect x="742" y="212" width="230" height="70" rx="14" fill="#F2F4F6"/>
    <text x="857" y="240" font-size="23.32" font-weight="700" fill="#191F28">요청 1: 삽입</text>
    <text x="857" y="266" font-size="22.43" fill="#4E5968">통과</text>
    <rect x="742" y="300" width="230" height="70" rx="14" fill="#F2F4F6"/>
    <text x="857" y="328" font-size="23.32" font-weight="700" fill="#191F28">요청 2: 삽입</text>
    <text x="857" y="354" font-size="22.43" fill="#4E5968">제약에 걸림</text>
    <rect x="1038" y="236" width="276" height="110" rx="14" fill="#0E1B2E" stroke="#3182F6"/>
    <text x="1176" y="278" font-size="23.32" font-weight="700" fill="#3182F6">이미 저장된 것을 돌려준다</text>
    <text x="1176" y="312" font-size="22.43" fill="#8B95A1">실패로 보지 않는다</text>
    <text x="1029" y="414" font-size="33" font-weight="800" fill="#3182F6">16건 동시 → 1건 남음</text>
  </g>
  <line x1="972" y1="250" x2="1032" y2="276" stroke="#3182F6" stroke-width="2" marker-end="url(#ib)"/>
  <line x1="972" y1="334" x2="1032" y2="308" stroke="#3182F6" stroke-width="2" marker-end="url(#ib)"/>

  <rect x="56" y="482" width="1288" height="106" rx="14" fill="#15181E" stroke="#2A2F38"/>
  <text x="84" y="518" font-size="23.32" font-weight="700" fill="#F5A524">걸렸던 것: sparse 는 복합 유니크에서 이름만 맞고 동작이 다르다</text>
  <text x="84" y="548" font-size="22.43" fill="#8B95A1">sparse 는 인덱스 키 중 하나라도 값이 있으면 색인한다. 방 번호만 있어도 문서가 들어가므로</text>
  <text x="84" y="576" font-size="22.43" fill="#8B95A1">식별자 없는 두 건이 서로 부딪혔다. 값이 문자열일 때만 제약을 거는 조건부 인덱스로 바꿨다</text>
</svg>

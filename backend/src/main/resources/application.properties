# -------------------------------------
# 기본 애플리케이션 정보
# -------------------------------------
# 프로젝트 이름
spring.application.name=Joying

# -------------------------------------
# 프로파일 설정
# -------------------------------------
# 기본 실행 프로파일 설정 (local, dev, prod 등)
spring.profiles.active=local

# -------------------------------------
# 🗄데이터베이스 설정
# -------------------------------------
# local 환경에서만 적용
spring.config.activate.on-profile=local
# DB URL
spring.datasource.url=jdbc:mysql://localhost:3306/project_db?serverTimezone=Asia/Seoul
# DB 계정명
spring.datasource.username=root
# DB 비밀번호
spring.datasource.password=ssafy

# -------------------------------------
# ⚙JPA 설정
# -------------------------------------
# 테이블 자동 생성(update: 변경사항 반영, create: 매번 새로 생성)
spring.jpa.hibernate.ddl-auto=update
# MySQL Dialect 명시적 설정 (자동 감지로 변경)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# SQL 보기 쉽게 포맷팅
spring.jpa.properties.hibernate.format_sql=true
# Lazy 로딩 성능 문제 방지 (View에서 영속성 컨텍스트 닫힘)
spring.jpa.open-in-view=false

# -------------------------------------
# JSON 변환 설정
# -------------------------------------
# JSON 필드명에 snake_case 사용 (ex: createdAt → created_at)
spring.jackson.property-naming-strategy=SNAKE_CASE
# -------------------------------------
# 파일 업로드 설정
# -------------------------------------
# 단일 파일 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 전체 요청 최대 크기
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------
# 로깅 설정
# -------------------------------------
# 실행되는 SQL 로그 출력
logging.level.org.hibernate.SQL=debug

# -------------------------------------
# Swagger/OpenAPI 설정
# -------------------------------------
# API 문서 경로
springdoc.api-docs.path=/api-docs
# Swagger UI 경로
springdoc.swagger-ui.path=/swagger-ui.html
# Swagger UI 활성화 (local, dev 환경에서만 true)
springdoc.swagger-ui.enabled=true
# API 문서 활성화
springdoc.api-docs.enabled=true
# 작업 정렬 (알파벳순)
springdoc.swagger-ui.operations-sorter=alpha
# 태그 정렬 (알파벳순)
springdoc.swagger-ui.tags-sorter=alpha
# 요청 처리 시간 표시
springdoc.swagger-ui.display-request-duration=true
# 기본 Swagger URL 비활성화
springdoc.swagger-ui.disable-swagger-default-url=true
# 문서 확장 설정 (none: 접힌 상태, list: 태그만 펼침, full: 전체 펼침)
springdoc.swagger-ui.doc-expansion=none
# 기본 Content Type
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json


# -------------------------------------
# Production
# -------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

logging.level.root=INFO
logging.level.com.joying=INFO
logging.level.org.hibernate.SQL=INFO

# -------------------------------------
# MongoDB (채팅 메시지 저장용 - 리소스 절약)
# -------------------------------------
# 프로덕션 환경 - 인증 사용 (Docker Compose .env.prod 기반)
# minPoolSize: 최소 커넥션 수 (5개로 축소)
# maxPoolSize: 최대 커넥션 수 (30개로 축소, 채팅 부하 고려)
# maxIdleTimeMS: 유휴 커넥션 유지 시간 (60초)
# waitQueueTimeoutMS: 커넥션 대기 타임아웃 (5초)
# connectTimeoutMS: 연결 타임아웃 (10초)
# serverSelectionTimeoutMS: 서버 선택 타임아웃 (5초)
spring.data.mongodb.uri=mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@${MONGODB_HOST}:${MONGODB_PORT}/${MONGODB_DATABASE}?authSource=admin&minPoolSize=5&maxPoolSize=30&maxIdleTimeMS=60000&waitQueueTimeoutMS=5000&connectTimeoutMS=10000&serverSelectionTimeoutMS=5000

# -------------------------------------
# Swagger
# -------------------------------------
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# -------------------------------------
# Server
# -------------------------------------
server.forward-headers-strategy=framework
server.tomcat.use-relative-redirects=true

# -------------------------------------
# Tomcat 스레드 풀 설정 (AI+DB와 리소스 공유, 채팅 부하 고려)
# -------------------------------------
# 최소 스레드 수 (메모리 절약)
server.tomcat.threads.min-spare=30
# 최대 스레드 수 (4 vCPU 기준, AI 서버와 공유 고려)
server.tomcat.threads.max=150
# 대기 큐 크기
server.tomcat.accept-count=150
# 최대 연결 수
server.tomcat.max-connections=300
# 연결 타임아웃 (20초)
server.tomcat.connection-timeout=20000
# Keep-Alive 타임아웃 (60초)
server.tomcat.keep-alive-timeout=60000
# 최대 Keep-Alive 요청 수
server.tomcat.max-keep-alive-requests=100

# -------------------------------------
# WebSocket 연결 제한 (채팅 부하 고려)
# -------------------------------------
# WebSocket 최대 세션 수 제한은 WebSocketConfig에서 설정
# WebSocket 메시지 최대 크기 (파일 전송 고려하여 10MB)
spring.websocket.message-size-limit=10485760
# WebSocket 버퍼 크기 (1MB)
spring.websocket.buffer-size-limit=1048576

# -------------------------------------
# HTTP/2 및 압축 설정
# -------------------------------------
# HTTP/2 활성화
server.http2.enabled=true
# 응답 압축 활성화
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# -------------------------------------
# HikariCP - MySQL 커넥션 풀 최적화 (리소스 절약)
# -------------------------------------
# 최소 유휴 커넥션 수
spring.datasource.hikari.minimum-idle=10
# 최대 커넥션 풀 크기 (Tomcat max threads 150 기준)
spring.datasource.hikari.maximum-pool-size=30
# 커넥션 타임아웃 (30초)
spring.datasource.hikari.connection-timeout=30000
# 유휴 커넥션 최대 유지 시간 (10분)
spring.datasource.hikari.idle-timeout=600000
# 커넥션 최대 수명 (30분)
spring.datasource.hikari.max-lifetime=1800000
# 커넥션 유효성 검사 타임아웃 (5초)
spring.datasource.hikari.validation-timeout=5000
# 커넥션 leak 감지 임계값 (60초)
spring.datasource.hikari.leak-detection-threshold=60000
# 커넥션 풀 이름
spring.datasource.hikari.pool-name=JoyingHikariPool

# -------------------------------------
# Redis 커넥션 풀 최적화
# -------------------------------------
# Lettuce (기본 Redis 클라이언트) 설정
spring.data.redis.lettuce.pool.enabled=true
# 최소 유휴 커넥션
spring.data.redis.lettuce.pool.min-idle=5
# 최대 유휴 커넥션
spring.data.redis.lettuce.pool.max-idle=15
# 최대 활성 커넥션
spring.data.redis.lettuce.pool.max-active=20
# 커넥션 대기 시간 (5초)
spring.data.redis.lettuce.pool.max-wait=5000ms
# 커넥션 타임아웃 (10초)
spring.data.redis.timeout=10000ms

# -------------------------------------
# WebClient (외부 API 호출 - Toss Payments, SSAFY API 등)
# -------------------------------------
# WebClient 커넥션 풀 최대 크기
spring.webflux.client.connection-pool.max-connections=100
# 대기 중인 요청 큐 크기
spring.webflux.client.connection-pool.pending-acquire-max-count=50
# 유휴 커넥션 타임아웃 (30초)
spring.webflux.client.connection-pool.max-idle-time=30s
# 커넥션 최대 수명 (5분)
spring.webflux.client.connection-pool.max-life-time=5m

# -------------------------------------
# Elasticsearch 커넥션 최적화
# -------------------------------------
# Elasticsearch 소켓 타임아웃 (30초)
spring.elasticsearch.socket-timeout=30s
# Elasticsearch 연결 타임아웃 (10초)
spring.elasticsearch.connection-timeout=10s
# -------------------------------------
# 📦 기본 애플리케이션 정보
# -------------------------------------
spring.application.name=Joying   # 프로젝트 이름

# -------------------------------------
# 🌱 프로파일 설정
# -------------------------------------
spring.profiles.active=local     # 기본 실행 프로파일 설정 (local, dev, prod 등)

# -------------------------------------
# 🗄️ 데이터베이스 설정
# -------------------------------------
spring.config.activate.on-profile=local   # local 환경에서만 적용
spring.datasource.url=jdbc:mysql://localhost:3306/project_db?serverTimezone=Asia/Seoul   # DB URL
spring.datasource.username=root           # DB 계정명
spring.datasource.password=root           # DB 비밀번호

# -------------------------------------
# ⚙️ JPA 설정
# -------------------------------------
# 테이블 자동 생성(update: 변경사항 반영, create: 매번 새로 생성)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true   # SQL 보기 쉽게 포맷팅
# Lazy 로딩 성능 문제 방지 (View에서 영속성 컨텍스트 닫힘)
spring.jpa.open-in-view=false

# -------------------------------------
# 🧱 JSON 변환 설정
# -------------------------------------
spring.jackson.property-naming-strategy=SNAKE_CASE   # JSON 필드명에 snake_case 사용 (ex: createdAt → created_at)

# -------------------------------------
# 📁 파일 업로드 설정
# -------------------------------------
# 단일 파일 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 전체 요청 최대 크기
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------
# 🪵 로깅 설정
# -------------------------------------
logging.level.org.hibernate.SQL=debug                # 실행되는 SQL 로그 출력

services:
  mysql:
    image: mysql:8.0
    container_name: joying-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - joying-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: joying-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - joying-network
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: joying-mongodb
    environment:
      TZ: Asia/Seoul
    ports:
      - "${MONGODB_PORT}:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - joying-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.5
    container_name: joying-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # 힙을 잡아 둔다.
      #
      # 지정하지 않으면 호스트 메모리의 절반을 잡는다. 이 프로젝트에서 재 보니 4.19GiB 를
      # 썼다. MySQL 362MiB, MongoDB 300MiB, Redis 13MiB 를 합친 것의 여섯 배다.
      #
      # 512MB 로 잡으니 905MiB 가 됐다. 색인 대상이 상품 제목과 몇 개 필드뿐이라 이만큼도
      # 넉넉하다. 늘려야 할 때는 색인 크기를 보고 정한다.
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - network.host=0.0.0.0
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - es-plugins:/usr/share/elasticsearch/plugins
    networks:
      - joying-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200 >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 12
    command:
      - /bin/bash
      - -c
      - |
        if [ ! -d "/usr/share/elasticsearch/plugins/analysis-nori" ]; then
          echo "📦 Installing analysis-nori plugin..."
          elasticsearch-plugin install --batch analysis-nori
        fi
        echo "✅ Starting Elasticsearch..."
        /usr/local/bin/docker-entrypoint.sh elasticsearch


networks:
  joying-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  mongodb-data:
  mongodb-config:
  es-data:
  es-plugins:
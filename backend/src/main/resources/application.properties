# -------------------------------------
# Toss Payments
# -------------------------------------

toss.secret-key=${TOSS_SECRET_KEY:test_sk_YOUR_TEST_SECRET_KEY}
toss.api.base-url=https://api.tosspayments.com

logging.level.com.joying.payment=DEBUG
logging.level.org.springframework.retry=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG

# -------------------------------------
# Resilience4j Circuit Breaker 설정
# -------------------------------------
# Circuit Breaker 기본 설정
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=50
resilience4j.circuitbreaker.configs.default.slowCallDurationThreshold=3s

# Toss Payments API 전용 Circuit Breaker
resilience4j.circuitbreaker.instances.tossPayments.baseConfig=default
resilience4j.circuitbreaker.instances.tossPayments.slidingWindowSize=20
resilience4j.circuitbreaker.instances.tossPayments.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.tossPayments.failureRateThreshold=60
resilience4j.circuitbreaker.instances.tossPayments.waitDurationInOpenState=30s

# Actuator 설정 (Circuit Breaker 모니터링)
management.endpoints.web.exposure.include=health,metrics,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.metrics.enable.resilience4j.circuitbreaker=true

# Circuit Breaker 로깅
logging.level.io.github.resilience4j=DEBUG

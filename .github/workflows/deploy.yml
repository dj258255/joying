# 배포한다.
#
# Jenkins 를 대신한다. 예전에는 서버에 사람이 .env.prod 를 미리 올려 두고 파이프라인이
# 그것을 복사했다. 그 파일이 어디서 왔는지 저장소에 남지 않았고, 서버를 새로 만들면
# 그것부터 다시 만들어야 했다.
#
# 이제 값은 vault 에 암호화해 저장소에 두고, Ansible 이 서버에서 .env 를 만든다.
# 서버에 사람이 미리 놓아 두어야 하는 파일이 없다.
name: 배포

on:
  push:
    branches: [main]
  # 되돌릴 때 쓴다. 어느 지점으로 갈지 고를 수 있어야 한다
  workflow_dispatch:
    inputs:
      ref:
        description: 배포할 지점 (브랜치나 태그)
        required: false
        default: main

# 같은 서버에 두 배포가 겹치면 서로를 덮어쓴다. 앞엣것을 멈추지 않고 기다린다
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ansible 설치
        run: pip install --disable-pip-version-check ansible-core

      - name: vault 암호를 파일로 둔다
        # 명령줄에 넣으면 프로세스 목록에 보인다. 파일로 두고 나중에 지운다
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/vault-pass
          chmod 600 /tmp/vault-pass

      - name: 배포 대상 서버 열쇠를 둔다
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 처음 붙는 서버라도 물어보지 않게 미리 넣어 둔다. 지문을 시크릿으로 받아
          # 넣는 이유는, 확인 없이 붙으면 중간에서 가로채도 알 수 없기 때문이다
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 문법을 먼저 본다
        run: |
          ansible-playbook -i ansible/inventory/prod.ini ansible/deploy.yml \
            --vault-password-file /tmp/vault-pass --syntax-check

      - name: 배포
        run: |
          ansible-playbook -i ansible/inventory/prod.ini ansible/deploy.yml \
            --vault-password-file /tmp/vault-pass \
            --extra-vars "deploy_ref=${{ inputs.ref || 'main' }}"

      - name: 열쇠를 지운다
        # 실패해도 지운다. 러너는 일회용이지만 습관으로 둔다
        if: always()
        run: rm -f /tmp/vault-pass ~/.ssh/id_ed25519

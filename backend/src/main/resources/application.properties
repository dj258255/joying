# -------------------------------------
# 📦 기본 애플리케이션 정보
# -------------------------------------
# 프로젝트 이름
spring.application.name=Joying

# -------------------------------------
# 🌱 프로파일 설정
# -------------------------------------
# 기본 실행 프로파일 설정 (local, dev, prod 등)
spring.profiles.active=local

# -------------------------------------
# 🗄️ 데이터베이스 설정
# -------------------------------------
# local 환경에서만 적용
spring.config.activate.on-profile=local
# DB URL
spring.datasource.url=jdbc:mysql://localhost:3306/project_db?serverTimezone=Asia/Seoul
# DB 계정명
spring.datasource.username=root
# DB 비밀번호
spring.datasource.password=root

# -------------------------------------
# ⚙️ JPA 설정
# -------------------------------------
# 테이블 자동 생성(update: 변경사항 반영, create: 매번 새로 생성)
spring.jpa.hibernate.ddl-auto=update
# SQL 보기 쉽게 포맷팅
spring.jpa.properties.hibernate.format_sql=true
# Lazy 로딩 성능 문제 방지 (View에서 영속성 컨텍스트 닫힘)
spring.jpa.open-in-view=false

# -------------------------------------
# 🧱 JSON 변환 설정
# -------------------------------------
# JSON 필드명에 snake_case 사용 (ex: createdAt → created_at)
spring.jackson.property-naming-strategy=SNAKE_CASE

# -------------------------------------
# 📁 파일 업로드 설정
# -------------------------------------
# 단일 파일 최대 크기
spring.servlet.multipart.max-file-size=10MB
# 전체 요청 최대 크기
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------
# 🪵 로깅 설정
# -------------------------------------
# 실행되는 SQL 로그 출력
logging.level.org.hibernate.SQL=debug

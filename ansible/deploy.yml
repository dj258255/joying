# 받아서 빌드하고 띄운다.
#
#   ansible-playbook -i inventory/prod.ini deploy.yml --ask-vault-pass
#
# Jenkins 를 쓸 때는 서버에 사람이 .env.prod 를 미리 올려 두어야 했다. 그 파일이
# 어디서 왔는지 저장소에 남지 않았고, 서버를 새로 만들면 그것부터 다시 만들어야 했다.
# 이제 vault 에서 꺼내 여기서 만든다.
- name: 빌려조잉 배포
  hosts: joying
  become: false

  tasks:
    - name: 코드를 받는다
      ansible.builtin.git:
        repo: "{{ repo_url | default('https://github.com/dj258255/joying.git') }}"
        dest: "{{ app_dir }}"
        version: "{{ deploy_ref | default('develop') }}"
        force: true

    - name: 환경 파일을 만든다
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        # 비밀이 들어 있다. 다른 사용자가 읽지 못하게 한다
        mode: "0600"
      # 값이 바뀌었는지 로그에 남기지 않는다. 남기면 비밀이 그대로 찍힌다
      no_log: true

    - name: AI 서비스 환경 파일을 만든다
      ansible.builtin.template:
        src: templates/ai-env.j2
        dest: "{{ app_dir }}/ai/.env"
        mode: "0600"
      no_log: true

    # 앞단은 인증서 파일이 없으면 뜨지 않는다. 그런데 certbot 은 갱신만 하고
    # 최초 발급을 하지 않으므로, 서버를 새로 만들면 아무도 첫 인증서를 만들지
    # 않는다. 앞단이 떠야 certbot 이 인증을 받을 수 있어 서로를 기다린다.
    #
    # 자체 서명한 것을 자리에 놓아 그 고리를 끊는다. 앞단이 뜨면 아래 안내대로
    # 진짜 인증서를 한 번 받고, 그 뒤로는 certbot 이 알아서 갱신한다.
    - name: 인증서 자리를 만든다
      ansible.builtin.file:
        path: "{{ app_dir }}/certbot/conf/live/{{ domain }}"
        state: directory
        mode: "0755"

    - name: 인증서가 없으면 임시로 자체 서명한 것을 둔다
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650
          -keyout {{ app_dir }}/certbot/conf/live/{{ domain }}/privkey.pem
          -out {{ app_dir }}/certbot/conf/live/{{ domain }}/fullchain.pem
          -subj /CN={{ domain }}
        creates: "{{ app_dir }}/certbot/conf/live/{{ domain }}/fullchain.pem"
      register: placeholder_cert

    - name: 임시 인증서를 둔 것을 알린다
      ansible.builtin.debug:
        msg: >-
          자체 서명한 임시 인증서를 두었다. 브라우저가 경고한다.
          진짜 인증서를 한 번 받아야 한다 - ansible/README.md 의 '첫 인증서' 를 보라
      when: placeholder_cert is changed

    - name: 이미지를 만든다
      ansible.builtin.command:
        cmd: docker compose --env-file .env -f {{ compose_file }} build backend nginx
        chdir: "{{ app_dir }}"
      register: build_result
      changed_when: build_result.rc == 0

    - name: 띄운다
      ansible.builtin.command:
        cmd: >-
          docker compose --env-file .env -f {{ compose_file }}
          up -d --remove-orphans
        chdir: "{{ app_dir }}"
      register: up_result
      changed_when: up_result.rc == 0

    - name: 떴는지 확인한다
      ansible.builtin.uri:
        url: "http://localhost:8080/actuator/health"
        status_code: [200, 503]
      register: health
      # 뜨는 데 시간이 걸린다. 한 번 보고 실패로 적으면 배포가 늘 실패한다
      retries: 30
      delay: 5
      until: health.status in [200, 503]

    - name: 결과를 적는다
      ansible.builtin.debug:
        msg: "배포 완료. 상태 확인 응답 {{ health.status }}"
